name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      freeze_stand:
        description: >-
          Golden stand to regenerate (core/tools/golden/<name>): runs run_golden.sh --freeze and
          uploads the new golden/ traces as an artifact to commit. Accepts a comma-separated list.
        required: false
        default: ''
      verify_stand:
        description: >-
          Golden stand(s) to verify regardless of the push diff (comma-separated list): runs
          run_golden.sh in verify mode, for refreshing status on unchanged stands.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run application and build-logic tests
        timeout-minutes: 35
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          ./gradlew :app:testFdroidDebugUnitTest verifyKotlinFileSize --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Check Play flavor behavior
        # The Play unit-test compile alone now runs past five minutes on the hosted runner;
        # the Fdroid unit-test step above gets 35 for the same reason.
        timeout-minutes: 15
        run: |
          ./gradlew :app:testPlayDebugUnitTest --tests 'com.newoether.agora.sandbox.PlaySandboxFlavorTest' --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Install C++ core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libssl-dev \
            libssh2-1-dev \
            zlib1g-dev

      - name: Build and run the C++ core tests
        run: |
          cmake -S core -B core-build -DCMAKE_BUILD_TYPE=Release
          cmake --build core-build
          ctest --test-dir core-build --output-on-failure

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools ndk;28.2.13676358"

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build PRoot runtime
        run: |
          chmod +x ./build-proot.sh
          ./build-proot.sh

      - name: Build F-Droid Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidRelease assembleDevRelease

      - name: Verify native library packaging
        run: |
          for apk_path in $(find app/build/outputs/apk/fdroid/release app/build/outputs/apk/dev/release -name '*.apk'); do
            echo "checking $apk_path"
            apk_entries=$(mktemp)
            trap 'rm -f "$apk_entries"' EXIT
            unzip -Z1 "$apk_path" > "$apk_entries"
            for library in libproot_exec.so libproot_loader.so libtalloc.so libagora_core.so; do
              entry="lib/arm64-v8a/$library"
              grep -Fxq "$entry" "$apk_entries" || {
                echo "Missing native library: $library in $apk_path" >&2
                exit 1
              }
            done
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-release
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/dev/release/*.apk
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agora-fdroid-release
          path: apks
      - name: Create Tag Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            apks/*.apk
        env:
          GH_TOKEN: ${{ github.token }}
  # The golden Kotlin stands (core/tools/golden/<stand>) used to be a developer-only loop.
  # CI now runs their verify for every stand whose own files changed in the push/PR, so the
  # repository rule is "never build locally, always use gh ci": C++ via ctest, Kotlin traces
  # via this job. --freeze stays a local (or dispatched) action when a drift is intentional.
  golden-stands:
    name: Golden stands (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install C++ core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libssl-dev \
            libssh2-1-dev \
            zlib1g-dev

      - name: Cache kotlinc and the jars
        uses: actions/cache@v4
        with:
          path: |
            .ci/kotlinc
            .ci/jars
          key: golden-kotlin-2.3.21-jars-v1

      - name: Provision the stand toolchain and run the changed stands
        env:
          BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p .ci/jars
          if [ ! -x .ci/kotlinc/bin/kotlinc ]; then
            curl -fsSL -o /tmp/kotlin.zip \
              https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
            unzip -q /tmp/kotlin.zip -d .ci
          fi
          base=https://repo1.maven.org/maven2
          fetch() { [ -f ".ci/jars/$2" ] || curl -fsSL -o ".ci/jars/$2" "$base/$1"; }
          fetch org/jetbrains/kotlinx/kotlinx-serialization-core-jvm/1.11.0/kotlinx-serialization-core-jvm-1.11.0.jar kotlinx-serialization-core-jvm-1.11.0.jar
          fetch org/jetbrains/kotlinx/kotlinx-serialization-json-jvm/1.11.0/kotlinx-serialization-json-jvm-1.11.0.jar kotlinx-serialization-json-jvm-1.11.0.jar
          fetch org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar kotlinx-coroutines-core-jvm-1.9.0.jar
          fetch org/xerial/sqlite-jdbc/3.46.1.3/sqlite-jdbc-3.46.1.3.jar sqlite-jdbc-3.46.1.3.jar
          fetch org/apache/commons/commons-compress/1.27.1/commons-compress-1.27.1.jar commons-compress-1.27.1.jar
          fetch commons-io/commons-io/2.16.1/commons-io-2.16.1.jar commons-io-2.16.1.jar

          export KOTLINC="$PWD/.ci/kotlinc/bin/kotlinc"
          plugin=$(ls .ci/kotlinc/lib | grep -E 'serialization.*compiler-plugin.*\.jar$' | head -1 || true)
          if [ -n "$plugin" ]; then export KOTLINX_SERIALIZATION_PLUGIN="$PWD/.ci/kotlinc/lib/$plugin"; fi
          export KOTLINX_JARS="$PWD/.ci/jars/kotlinx-serialization-core-jvm-1.11.0.jar:$PWD/.ci/jars/kotlinx-serialization-json-jvm-1.11.0.jar:$PWD/.ci/jars/kotlinx-coroutines-core-jvm-1.9.0.jar:$PWD/.ci/jars/sqlite-jdbc-3.46.1.3.jar:$PWD/.ci/jars/commons-compress-1.27.1.jar:$PWD/.ci/jars/commons-io-2.16.1.jar"
          export COROUTINES_JAR="$PWD/.ci/jars/kotlinx-coroutines-core-jvm-1.9.0.jar"

          base="$BASE_SHA"
          if [ "${PR_BASE_SHA:-}" != "" ]; then base="$PR_BASE_SHA"; fi
          if [ -z "$base" ] || [ "${base:0:8}" = "00000000" ]; then base="HEAD~1"; fi
          stands=$(git diff --name-only "$base" "$HEAD_SHA" -- core/tools/golden 2>/dev/null \
                   | cut -d/ -f4 | sort -u)

          # The stand binaries the scripts fall back to (extract/profiles/scenario generator).
          cmake -S core -B core-build -DCMAKE_BUILD_TYPE=Release
          cmake --build core-build --target agora_extract agora_scenarios -j2
          # The stand scripts fall back to core/build/<tool>; stage the two binaries there.
          mkdir -p core/build
          cp core-build/agora_extract core-build/agora_scenarios core/build/

          # Dispatched freeze: regenerate one stand's golden and publish it as an artifact so the
          # traces can be committed without a local kotlinc run.
          if [ "${{ github.event.inputs.freeze_stand }}" != "" ]; then
            stands=$(echo "${{ github.event.inputs.freeze_stand }}" | tr ',' ' ')
          elif [ "${{ github.event.inputs.verify_stand }}" != "" ]; then
            stands=$(echo "${{ github.event.inputs.verify_stand }}" | tr ',' ' ')
          fi

          total=0; failed=""
          for stand in $stands; do
            [ -n "$stand" ] || continue
            [ -f "core/tools/golden/$stand/run_golden.sh" ] || continue
            total=$((total + 1))
            echo "::group::stand $stand"
            args=""
            if [ "${{ github.event.inputs.freeze_stand }}" != "" ]; then
              args="--freeze"
            fi
            if ! (cd "core/tools/golden/$stand" && timeout 1500 ./run_golden.sh $args); then
              failed="$failed $stand"
            fi
            echo "::endgroup::"
          done
          if [ "$total" -eq 0 ]; then
            echo "No golden stand changed in $base..$HEAD_SHA"
            exit 0
          fi
          if [ -n "$failed" ]; then
            echo "Golden stand verify failed:$failed" >&2
            exit 1
          fi
          echo "All $total changed golden stands verified."
      - name: Stage the regenerated golden traces
        if: ${{ github.event.inputs.freeze_stand != '' }}
        run: |
          mkdir -p .ci/frozen
          for stand in $(echo "${{ github.event.inputs.freeze_stand }}" | tr ',' ' '); do
            mkdir -p ".ci/frozen/$stand"
            cp -r "core/tools/golden/$stand/golden/." ".ci/frozen/$stand/"
          done

      - name: Publish regenerated golden traces
        if: ${{ github.event.inputs.freeze_stand != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-frozen
          path: .ci/frozen/
          if-no-files-found: error
          retention-days: 7
