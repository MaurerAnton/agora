name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply ARMv7 NEON fix
        run: git apply --directory=thirdparty/llama.cpp .github/sgemm-armv7.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;26.3.11579264'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create keystore properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat > local.properties << EOF
          storeFile=../keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Rename APKs for release
        run: |
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(echo "$apk" | sed 's/.*app-\(.*\)-release.apk/\1/')
            cp "$apk" "agora-${abi}.apk"
          done

      - name: Create/Update Release (main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            --title "Latest Build" \
            --notes "Automated build from main branch (${{ github.sha }})." \
            --prerelease \
            agora-arm64-v8a.apk \
            agora-armeabi-v7a.apk
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            agora-arm64-v8a.apk \
            agora-armeabi-v7a.apk
        env:
          GH_TOKEN: ${{ github.token }}
